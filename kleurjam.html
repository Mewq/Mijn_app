<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Kleurjam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161527;
    --panel:#262448;
    --panel-2:#312c5e;
    --slot:#1c1a37;
    --amber:#FFB238;
    --amber-dark:#e2942a;
    --cream:#F5EFE6;
    --muted:#9d98c7;
    --mint:#3ddc97;
    --frame:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 50% -10%, #3a3570 0%, #201e3d 45%, #131225 100%);
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--cream);
    display:flex;
    justify-content:center;
    padding:18px 12px 34px;
  }
  #app{width:100%;max-width:440px;user-select:none;-webkit-user-select:none;}
  header{
    display:flex;align-items:flex-start;justify-content:space-between;
    margin-bottom:14px;gap:10px;flex-wrap:wrap;
  }
  .title-wrap{flex:1 1 auto;min-width:0;}
  .title-wrap h1{
    font-family:'Baloo 2',system-ui,sans-serif;
    font-size:30px;font-weight:800;letter-spacing:.5px;margin:0;line-height:1;
    background:linear-gradient(180deg,#fff, var(--amber) 140%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .title-wrap p{margin:4px 0 0;font-size:13px;color:var(--muted);font-weight:600;}
  .hud{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 1 auto;}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .pill[hidden]{display:none;}
  .pill{
    background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:999px;
    padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .pill b{color:var(--cream);font-family:'Baloo 2';font-weight:700;}
  .btn-row{display:flex;gap:6px;}
  .icon-btn{
    background:var(--panel);border:1px solid rgba(255,255,255,.1);color:var(--cream);
    border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;
    font-family:'Nunito',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;
    transition:transform .15s ease, background .15s ease, opacity .15s ease;
  }
  .icon-btn:hover{background:var(--panel-2);}
  .icon-btn:active{transform:scale(.94);}
  .icon-btn:disabled{opacity:.35;cursor:default;}
  .icon-btn:focus-visible,.lvl-tile:focus-visible,.btn-primary:focus-visible,.btn-secondary:focus-visible{
    outline:2px solid var(--amber);outline-offset:2px;
  }

  #level-banner{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:12px;gap:10px;
  }
  #level-banner .lvl-name{font-family:'Baloo 2';font-weight:700;font-size:16px;color:var(--cream);}
  #level-banner .lvl-num{color:var(--amber);font-weight:800;}
  #level-banner .lvl-meta{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap;}

  #board-wrap{width:100%;display:flex;justify-content:center;margin-bottom:16px;}
  #board{
    position:relative;
    background:linear-gradient(160deg,var(--panel),var(--panel-2) 120%);
    border-radius:22px;
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,.06),
      0 24px 44px -14px rgba(0,0,0,.6);
    overflow:visible;
  }
  .cells-layer{position:absolute;display:grid;}
  .cell{
    background:var(--slot);margin:var(--cell-gap,3px);border-radius:var(--cell-rad,10px);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.03);
  }
  .cell.wall{
    margin:0;border-radius:0;
    background:repeating-linear-gradient(45deg, #4a4468 0 5px, #3b3656 5px 10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
  .gate{
    position:absolute;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25), 0 0 12px 1px currentColor;
    opacity:.92;animation:gate-pulse 2.4s ease-in-out infinite;
  }
  @keyframes gate-pulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.28);}}
  .blocks-layer{position:absolute;}

  .block{
    /* only the filled cells may be grabbed: the empty corner of an L or T shape
       must let the block underneath receive the touch */
    pointer-events:none;
    position:absolute;cursor:grab;touch-action:none;
    transition:left .26s cubic-bezier(.2,.8,.3,1.2), top .26s cubic-bezier(.2,.8,.3,1.2), opacity .3s ease;
    filter:drop-shadow(0 7px 10px rgba(0,0,0,.5));
  }
  .block.dragging{transition:none;cursor:grabbing;z-index:20;filter:drop-shadow(0 13px 18px rgba(0,0,0,.65));}
  .block.exited{pointer-events:none;}
  .bcell{position:absolute;pointer-events:auto;}
  .grip{
    position:absolute;display:grid;place-items:center;
    pointer-events:none;opacity:.55;
  }
  .grip .dot{
    position:absolute;left:50%;top:50%;
    width:var(--dot,5px);height:var(--dot,5px);
    margin:calc(var(--dot,5px) / -2) 0 0 calc(var(--dot,5px) / -2);
    border-radius:50%;background:rgba(255,255,255,.95);
  }
  .grip.free .dot.n{transform:translateY(calc(-1 * var(--reach,8px)));}
  .grip.free .dot.s{transform:translateY(var(--reach,8px));}
  .grip.free .dot.e{transform:translateX(var(--reach,8px));}
  .grip.free .dot.w{transform:translateX(calc(-1 * var(--reach,8px)));}
  .grip.free .dot.c{opacity:.7;}
  .grip.horiz .dot.a{transform:translateX(calc(-1 * var(--reach,8px)));}
  .grip.horiz .dot.b{transform:translateX(var(--reach,8px));}
  .grip.vert .dot.a{transform:translateY(calc(-1 * var(--reach,8px)));}
  .grip.vert .dot.b{transform:translateY(var(--reach,8px));}

  .c-stone{background-image:linear-gradient(135deg,#8f8ab0,#6b6690 55%,#4e4a6e);}
  .c-red{background-image:linear-gradient(135deg,#ff8184,#F94144 55%,#d92e31);}
  .c-orange{background-image:linear-gradient(135deg,#ffab6d,#F3722C 55%,#d15c1c);}
  .c-yellow{background-image:linear-gradient(135deg,#ffe9ac,#F9C74F 55%,#e0a827);}
  .c-green{background-image:linear-gradient(135deg,#8fe3c4,#43AA8B 55%,#2f8a6d);}
  .c-teal{background-image:linear-gradient(135deg,#95edf2,#22B8CF 55%,#1795a8);}
  .c-blue{background-image:linear-gradient(135deg,#7fc0dd,#277DA1 55%,#1c5f7d);}
  .c-purple{background-image:linear-gradient(135deg,#dab6ff,#9D4EDD 55%,#7d2fc0);}
  .c-pink{background-image:linear-gradient(135deg,#ffa3cb,#F72585 55%,#d10f68);}

  .gate.c-red{color:#F94144;background-image:linear-gradient(135deg,#ff9092,#F94144);}
  .gate.c-orange{color:#F3722C;background-image:linear-gradient(135deg,#ffb583,#F3722C);}
  .gate.c-yellow{color:#F9C74F;background-image:linear-gradient(135deg,#ffedb8,#F9C74F);}
  .gate.c-green{color:#43AA8B;background-image:linear-gradient(135deg,#a0ecd2,#43AA8B);}
  .gate.c-teal{color:#22B8CF;background-image:linear-gradient(135deg,#aef1f5,#22B8CF);}
  .gate.c-blue{color:#277DA1;background-image:linear-gradient(135deg,#9cd2ea,#277DA1);}
  .gate.c-purple{color:#9D4EDD;background-image:linear-gradient(135deg,#e4c6ff,#9D4EDD);}
  .gate.c-pink{color:#F72585;background-image:linear-gradient(135deg,#ffbcdb,#F72585);}

  /* --- tegels met een eigenschap --- */
  .cell.ice{
    background:linear-gradient(160deg,#2e5470,#1e3a4e);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.4), inset 0 0 0 1.5px rgba(150,225,255,.4);
  }
  .arrows-layer{position:absolute;pointer-events:none;z-index:30;}
  .arrow-tile{
    position:absolute;display:grid;place-items:center;
    color:rgba(200,235,255,.9);font-weight:800;line-height:1;
    text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6);
  }

  /* --- poorten op slot --- */
  .gate.shut{
    background-image:repeating-linear-gradient(45deg,#6b6490 0 4px,#4c4670 4px 8px);
    animation:none;opacity:.9;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
  }
  .gate-lock{
    position:absolute;display:grid;place-items:center;z-index:31;
    font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;color:var(--cream);
    background:rgba(16,14,32,.9);border-radius:999px;pointer-events:none;
    box-shadow:0 2px 6px rgba(0,0,0,.55);
  }

  /* --- blokken met een eigenschap --- */
  .badge{
    position:absolute;display:grid;place-items:center;z-index:2;
    border-radius:999px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;
    color:#fff;background:rgba(16,14,32,.85);pointer-events:none;
    box-shadow:0 2px 5px rgba(0,0,0,.5);
  }
  .badge.bomb{background:rgba(46,10,14,.9);box-shadow:0 0 0 1.5px rgba(255,130,130,.75);}
  .badge.frost{background:rgba(10,34,54,.9);box-shadow:0 0 0 1.5px rgba(160,225,255,.75);}
  .frost-layer{
    position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(150deg,rgba(200,240,255,.5),rgba(120,190,235,.3));
    box-shadow:inset 0 0 0 2px rgba(225,248,255,.55);
  }
  .block.frozen{filter:saturate(.45) brightness(.85) drop-shadow(0 7px 10px rgba(0,0,0,.5));cursor:default;}
  .block.armed .bcell{animation:tick .6s ease-in-out infinite;}
  @keyframes tick{50%{filter:brightness(1.55);}}
  .block.armed{animation:shake .6s ease-in-out infinite;}
  @keyframes shake{25%{transform:translateX(-1.5px);}75%{transform:translateX(1.5px);}}
  .half2{position:absolute;inset:0;border-radius:inherit;clip-path:polygon(100% 0,100% 100%,0 100%);}
  .keymark{position:absolute;display:grid;place-items:center;z-index:2;pointer-events:none;}
  /* een blok dat het bord af is, mag geen aanrakingen meer opvangen */
  .block.exited, .block.exited .bcell{pointer-events:none;}

  .stars{display:flex;gap:4px;justify-content:center;margin-bottom:10px;font-size:26px;line-height:1;}
  .stars .s{opacity:.22;}
  .stars .s.on{opacity:1;filter:drop-shadow(0 2px 6px rgba(255,178,56,.6));}
  .lvl-tile .st{font-size:9px;letter-spacing:1px;line-height:1;color:var(--amber);}
  .win-card .bonus{color:var(--amber);font-weight:800;font-size:12.5px;margin:-14px 0 16px;}

  #hint{
    text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;
    margin:-4px 0 16px;min-height:16px;
  }

  .levels-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:0 2px 8px;font-size:12px;font-weight:800;color:var(--muted);
    letter-spacing:.6px;text-transform:uppercase;
  }
  #levels{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  }
  .lvl-tile{
    background:var(--panel);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;padding:8px 4px 6px;cursor:pointer;color:var(--muted);
    font-family:'Nunito',sans-serif;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    transition:transform .15s ease, background .15s ease;
  }
  .lvl-tile .n{font-family:'Baloo 2';font-weight:700;font-size:16px;color:var(--cream);line-height:1;}
  .lvl-tile .p{font-size:9.5px;font-weight:700;letter-spacing:.3px;}
  .lvl-tile.active{
    background:linear-gradient(160deg,var(--amber),var(--amber-dark));
    box-shadow:0 6px 14px -4px rgba(255,178,56,.55);
  }
  .lvl-tile.active .n,.lvl-tile.active .p{color:#2b1c02;}
  .lvl-tile.solved:not(.active){border-color:rgba(61,220,151,.4);}
  .lvl-tile.solved:not(.active) .p{color:var(--mint);}
  .lvl-tile.perfect:not(.active) .n{color:var(--mint);}
  .lvl-tile:active{transform:scale(.93);}

  #win-modal{
    position:fixed;inset:0;background:rgba(15,14,28,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  #win-modal.show{opacity:1;pointer-events:auto;}
  .win-card{
    position:relative;overflow:hidden;
    background:linear-gradient(165deg,var(--panel),var(--panel-2));
    border-radius:24px;padding:30px 26px 26px;width:290px;text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
    transform:translateY(14px) scale(.96);
    transition:transform .3s cubic-bezier(.2,.8,.3,1.3);
  }
  #win-modal.show .win-card{transform:translateY(0) scale(1);}
  .win-card .emoji{font-size:44px;margin-bottom:6px;}
  .win-card h2{font-family:'Baloo 2';margin:0 0 4px;font-size:24px;color:var(--mint);}
  .win-card p{margin:0 0 20px;color:var(--muted);font-weight:600;font-size:13.5px;}
  .win-actions{display:flex;flex-direction:column;gap:10px;}
  .btn-primary{
    background:linear-gradient(160deg,var(--amber),var(--amber-dark));
    border:none;color:#2b1c02;font-family:'Baloo 2';font-weight:700;font-size:15px;
    padding:12px;border-radius:14px;cursor:pointer;
  }
  .btn-secondary{
    background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--cream);
    font-family:'Nunito';font-weight:700;font-size:13px;padding:10px;border-radius:14px;cursor:pointer;
  }
  #fail-modal{
    position:fixed;inset:0;background:rgba(15,14,28,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  #fail-modal.show{opacity:1;pointer-events:auto;}
  #fail-modal .win-card h2{color:#ff8a8a;}
  .confetti{position:absolute;width:8px;height:14px;top:-20px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0;}}
  footer{text-align:center;margin-top:18px;font-size:11px;color:rgba(157,152,199,.6);}

  @media (max-width:390px){
    .title-wrap h1{font-size:25px;}
    .title-wrap p{font-size:12px;}
    .pill{padding:5px 9px;font-size:11px;}
    .icon-btn{padding:5px 10px;font-size:11px;}
    #levels{grid-template-columns:repeat(4,1fr);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
    .block{transition:none;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title-wrap">
      <h1>KLEURJAM</h1>
      <p>Sleep elk gekleurd blok naar zijn poort</p>
    </div>
    <div class="hud">
      <div class="pill-row">
        <div class="pill">🕹️ <b id="moves-count">0</b> zetten</div>
        <div class="pill" id="timer-pill" hidden>⏱️ <b id="time-left">0:00</b></div>
        <div class="pill">🧩 <b id="left-count">0</b> te gaan</div>
      </div>
      <div class="btn-row">
        <button class="icon-btn" id="undo-btn" disabled>↶ Terug</button>
        <button class="icon-btn" id="restart-btn">↺ Opnieuw</button>
      </div>
    </div>
  </header>

  <div id="level-banner">
    <div class="lvl-name"><span class="lvl-num" id="lvl-num">1</span> — <span id="lvl-name">Opwarmertje</span></div>
    <div class="lvl-meta" id="lvl-meta"></div>
  </div>

  <div id="board-wrap">
    <div id="board">
      <div class="cells-layer" id="cells-layer"></div>
      <div id="gates-layer"></div>
      <div class="blocks-layer" id="blocks-layer"></div>
      <div class="arrows-layer" id="arrows-layer"></div>
    </div>
  </div>

  <div id="hint"></div>

  <div class="levels-head"><span>Levels</span><span id="levels-progress"></span></div>
  <div id="levels"></div>

  <footer>Grijze stenen blijven altijd op het bord — schuif ze aan de kant</footer>
</div>

<div id="fail-modal">
  <div class="win-card">
    <div class="emoji" id="fail-emoji">💥</div>
    <h2 id="fail-title">Mislukt</h2>
    <p id="fail-sub"></p>
    <div class="win-actions">
      <button class="btn-primary" id="retry-btn">Opnieuw proberen</button>
    </div>
  </div>
</div>

<div id="win-modal">
  <div class="win-card">
    <div class="emoji" id="win-emoji">🎉</div>
    <h2 id="win-title">Level gehaald!</h2>
    <div class="stars" id="win-stars"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
    <p id="win-sub">Opgelost in 0 zetten</p>
    <p class="bonus" id="win-bonus" hidden>✨ Bonuskleur gehaald</p>
    <div class="win-actions">
      <button class="btn-primary" id="next-level-btn">Volgend level →</button>
      <button class="btn-secondary" id="replay-btn">Speel nog eens</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const FRAME = 14;
  let GAP = 6;          // scaled to the cell size in computeCellSize()
  let RAD = 12;

  /* Alle levels spelen op een 12x12 bord en zijn machinaal gegenereerd en
     nagerekend: van elk level bestaat een uitgespeelde oplossing van precies
     `par` zetten. `par` is dus de kortste route die wij gevonden hebben — een
     streefgetal, geen bewezen minimum. */
  const LEVELS = [
    {
      name:"Eerste kleur", par:6, starMargin:0.25,
      rows:12, cols:12,
      walls:[[1,9],[1,10],[9,4],[9,5]],
      blocks:[
        {id:"b0",color:"purple",move:"H",row:4,col:10,cells:[[0,0],[0,1],[1,1]]},
        {id:"b1",color:"red",move:"A",row:2,col:9,cells:[[0,2],[1,0],[1,1],[1,2]]},
        {id:"b2",color:"teal",move:"V",row:4,col:4,cells:[[0,0],[0,1]]},
        {id:"b3",color:"pink",move:"H",row:9,col:2,cells:[[0,0],[0,1],[1,0],[2,0],[2,1]]},
        {id:"b4",color:"stone",move:"A",row:6,col:5,cells:[[0,0],[1,0]]},
        {id:"b5",color:"stone",move:"A",row:5,col:6,cells:[[0,0],[1,0]]}
      ],
      gates:[{color:"purple",side:"left",index:4,span:2},{color:"red",side:"bottom",index:6,span:4},{color:"teal",side:"top",index:3,span:3},{color:"pink",side:"left",index:9,span:3}],
      hint:"Sleep elk blok naar de poort met dezelfde kleur."
    },
    {
      name:"Voorrang", par:9, starMargin:0.25,
      rows:12, cols:12,
      walls:[[7,7],[8,7],[9,7],[1,9]],
      blocks:[
        {id:"b0",color:"yellow",move:"A",row:0,col:0,cells:[[0,0],[0,1],[0,2],[1,2]]},
        {id:"b1",color:"red",move:"A",row:10,col:1,cells:[[0,0],[1,0],[1,1],[1,2]]},
        {id:"b2",color:"purple",move:"A",row:9,col:4,cells:[[0,0],[0,1],[1,0],[2,0]]},
        {id:"b3",color:"orange",move:"A",row:8,col:9,cells:[[0,1],[0,2],[1,0],[1,1]]},
        {id:"b4",color:"stone",move:"A",row:7,col:8,cells:[[0,0],[1,0],[1,1]]},
        {id:"b5",color:"stone",move:"V",row:6,col:6,cells:[[0,0],[0,1]]}
      ],
      gates:[{color:"yellow",side:"right",index:5,span:3},{color:"red",side:"left",index:9,span:3},{color:"purple",side:"left",index:1,span:4},{color:"orange",side:"bottom",index:6,span:3}],
      hint:"Eén blok staat het andere in de weg. Wie eerst?"
    },
    {
      name:"Alle kanten op", par:12, starMargin:0.25,
      rows:12, cols:12,
      walls:[[4,3],[4,4],[4,5],[8,3]],
      blocks:[
        {id:"b0",color:"red",move:"H",row:10,col:8,cells:[[0,0],[1,0],[1,1],[1,2]]},
        {id:"b1",color:"blue",move:"A",row:5,col:1,cells:[[0,0],[0,1],[1,0],[2,0],[2,1]]},
        {id:"b2",color:"purple",move:"A",row:0,col:0,cells:[[0,0],[1,0],[1,1],[2,1]]},
        {id:"b3",color:"pink",move:"A",row:8,col:10,cells:[[0,0],[1,0],[1,1],[2,0]]},
        {id:"b4",color:"stone",move:"A",row:6,col:5,cells:[[0,1],[1,0],[1,1]]},

  /* ---------- rules engine (identical to the offline solver) ---------- */

  const key = (r,c) => r + "," + c;

  /* ---- toestandsafhankelijke mechanics ---- */

  function exitedTotal(){
    let n = 0;
    for(const b of blocks) if(b.exited) n++;
    return n;
  }

  function gateOpen(g){
    if(!g) return false;
    if(g.locked && exitedTotal() < g.locked.openAfter) return false;
    if(g.keyLocked){
      const k = blocks.find(b => b.key);
      if(!k || !k.exited) return false;
    }
    return true;
  }

  function blockFrozen(b){
    return !!b.frozen && exitedTotal() < b.frozen.thawAfter;
  }

  function gatesOf(b){
    return (b.colors && b.colors.length ? b.colors : [b.color])
      .map(c => gates.find(g => g.color === c)).filter(Boolean);
  }

  function bombLeft(b){
    if(!b.bomb) return null;
    if(b.bomb.type === "moves") return b.bomb.value - moveCount;
    if(!clockStarted) return b.bomb.value;
    return Math.ceil(b.bomb.value - (Date.now() - clockStarted)/1000);
  }

  /* een pijltegel mag alleen in zijn eigen richting betreden worden */
  function arrowsAllow(b, fromR, fromC, toR, toC, dirName){
    if(!arrowMap.size) return true;
    for(const rc of b.cells){
      const r = toR + rc[0], c = toC + rc[1];
      if(r < 0 || c < 0 || r >= ROWS || c >= COLS) continue;
      const a = arrowMap.get(key(r,c));
      if(!a) continue;
      let wasMine = false;
      for(const rc2 of b.cells){
        if(fromR + rc2[0] === r && fromC + rc2[1] === c){ wasMine = true; break; }
      }
      if(wasMine) continue;
      if(a !== dirName) return false;
    }
    return true;
  }

  function onIce(b, r0, c0){
    if(!iceSet.size) return false;
    for(const rc of b.cells){
      const r = r0 + rc[0], c = c0 + rc[1];
      if(r < 0 || c < 0 || r >= ROWS || c >= COLS) continue;
      if(iceSet.has(key(r,c))) return true;
    }
    return false;
  }

  function cellsAt(b, row, col){
    const out = [];
    for(const rc of b.cells) out.push([row + rc[0], col + rc[1]]);
    return out;
  }

  function occupancy(excludeId){
    const s = new Set();
    for(const b of blocks){
      if(b.exited || b.id === excludeId) continue;
      for(const rc of cellsAt(b, b.row, b.col)) s.add(key(rc[0], rc[1]));
    }
    return s;
  }

  function fitsInside(b, row, col, occ){
    for(const rc of cellsAt(b, row, col)){
      const r = rc[0], c = rc[1];
      if(r < 0 || c < 0 || r >= ROWS || c >= COLS) return false;
      if(wallSet.has(key(r,c))) return false;
      if(occ.has(key(r,c))) return false;
    }
    return true;
  }

  function gateOf(color){ return gates.find(g => g.color === color); }

  function canStep(b, r, c, dr, dc, occ){
    if(!fitsInside(b, r + dr, c + dc, occ)) return false;
    return arrowsAllow(b, r, c, r + dr, c + dc, DIR_NAME[dr + "," + dc]);
  }

  function outsideOk(r, c, gate){
    const lo = gate.index, hi = gate.index + gate.span - 1;
    if(gate.side === "right")  return c >= COLS && r >= lo && r <= hi && r >= 0 && r < ROWS;
    if(gate.side === "left")   return c < 0     && r >= lo && r <= hi && r >= 0 && r < ROWS;
    if(gate.side === "bottom") return r >= ROWS && c >= lo && c <= hi && c >= 0 && c < COLS;
    if(gate.side === "top")    return r < 0     && c >= lo && c <= hi && c >= 0 && c < COLS;
    return false;
  }

  // aantal stappen om via deze poort het bord te verlaten, of -1
  function exitStepsVia(b, row, col, occ, gate){
    if(!gate) return -1;
    if(b.move !== "A" && b.move !== SIDE_AXIS[gate.side]) return -1;
    if(!gateOpen(gate)) return -1;
    const d = SIDE_DIR[gate.side];
    const dirName = DIR_NAME[d[0] + "," + d[1]];
    let pr = row, pc = col;
    for(let k = 1; k <= ROWS + COLS + 4; k++){
      const nr = row + d[0]*k, nc = col + d[1]*k;
      if(!arrowsAllow(b, pr, pc, nr, nc, dirName)) return -1;
      let allOut = true;
      for(const rc of b.cells){
        const r = nr + rc[0], c = nc + rc[1];
        const inside = r >= 0 && r < ROWS && c >= 0 && c < COLS;
        if(inside){
          allOut = false;
          if(wallSet.has(key(r,c)) || occ.has(key(r,c))) return -1;
        } else if(!outsideOk(r, c, gate)){
          return -1;
        }
      }
      pr = nr; pc = nc;
      if(allOut) return k;
    }
    return -1;
  }

  // goedkoopste uitgang, over alle poorten die dit blok mag gebruiken
  function exitGateFor(b, row, col, occ){
    let best = null, bestK = -1;
    for(const g of gatesOf(b)){
      const k = exitStepsVia(b, row, col, occ, g);
      if(k > 0 && (bestK < 0 || k < bestK)){ bestK = k; best = g; }
    }
    return best ? {gate:best, steps:bestK} : null;
  }

  function exitSteps(b, row, col, occ){
    const info = exitGateFor(b, row, col, occ);
    return info ? info.steps : -1;
  }

  /* Gedwongen doorglijden op ijs: gaat door in dezelfde richting zolang het blok
     ijs raakt. Naar buiten glijden door een open poort telt gewoon als opgelost. */
  function iceSlide(b, r, c, dr, dc, occ){
    if(!iceSet.size) return {r, c, exit:false};
    let guard = 0;
    while(onIce(b, r, c) && guard++ < ROWS + COLS){
      const info = exitGateFor(b, r, c, occ);
      if(info){
        const d = SIDE_DIR[info.gate.side];
        if(d[0] === dr && d[1] === dc) return {r, c, exit:true};
      }
      if(!canStep(b, r, c, dr, dc, occ)) break;
      r += dr; c += dc;
    }
    return {r, c, exit:false};
  }

  // hoe ver een blok langs één as mag, en of het naar buiten kan
  function dragRange(b, axis, occ){
    const dr = axis === "V" ? 1 : 0, dc = axis === "H" ? 1 : 0;
    let neg = 0, pos = 0;
    let r = b.row, c = b.col;
    while(canStep(b, r, c, -dr, -dc, occ)){ r -= dr; c -= dc; neg++; }
    r = b.row; c = b.col;
    while(canStep(b, r, c, dr, dc, occ)){ r += dr; c += dc; pos++; }

    let exitSide = null, exitOffset = 0;
    const info = exitGateFor(b, b.row, b.col, occ);
    if(info && SIDE_AXIS[info.gate.side] === axis){
      exitOffset = info.steps;
      exitSide = (info.gate.side === "right" || info.gate.side === "bottom") ? "pos" : "neg";
    }
    return {neg, pos, exitSide, exitOffset};
  }

  /* ---------- rendering ---------- */

  function computeCellSize(){
    const w = boardWrap.clientWidth;
    const raw = Math.floor((w - 2*FRAME) / COLS);
    const size = Math.max(16, Math.min(78, raw));
    GAP = Math.max(2, Math.round(size * 0.10));
    RAD = Math.max(4, Math.round(size * 0.20));
    return size;
  }

  function gripFor(b){
    const grip = document.createElement("div");
    const kind = b.move === "A" ? "free" : (b.move === "H" ? "horiz" : "vert");
    grip.className = "grip " + kind;
    const names = kind === "free" ? ["n","s","e","w","c"] : ["a","c","b"];
    for(const n of names){
      const d = document.createElement("div");
      d.className = "dot " + n;
      grip.appendChild(d);
    }
    return grip;
  }

  function buildBlockEl(b){
    const el = document.createElement("div");
    el.className = "block";
    el.setAttribute("role","button");
    el.setAttribute("tabindex","0");
    const set = new Set(b.cells.map(rc => rc[0] + "," + rc[1]));
    let maxR = 0, maxC = 0, sumR = 0, sumC = 0;
    for(const rc of b.cells){
      maxR = Math.max(maxR, rc[0]); maxC = Math.max(maxC, rc[1]);
      sumR += rc[0]; sumC += rc[1];
    }
    const bw = (maxC+1)*cellSize, bh = (maxR+1)*cellSize;
    el.style.width = bw + "px";
    el.style.height = bh + "px";

    for(const rc of b.cells){
      const dr = rc[0], dc = rc[1];
      const up    = set.has((dr-1) + "," + dc);
      const down  = set.has((dr+1) + "," + dc);
      const left  = set.has(dr + "," + (dc-1));
      const right = set.has(dr + "," + (dc+1));
      const cell = document.createElement("div");
      cell.className = "bcell c-" + b.color;
      cell.style.left   = (dc*cellSize + GAP/2) + "px";
      cell.style.top    = (dr*cellSize + GAP/2) + "px";
      cell.style.width  = (cellSize - GAP + (right ? GAP : 0)) + "px";
      cell.style.height = (cellSize - GAP + (down  ? GAP : 0)) + "px";
      // one continuous gradient across the whole block
      cell.style.backgroundSize = bw + "px " + bh + "px";
      cell.style.backgroundPosition = (-dc*cellSize) + "px " + (-dr*cellSize) + "px";
      cell.style.borderTopLeftRadius     = (!up && !left)    ? RAD+"px" : "0";
      cell.style.borderTopRightRadius    = (!up && !right)   ? RAD+"px" : "0";
      cell.style.borderBottomLeftRadius  = (!down && !left)  ? RAD+"px" : "0";
      cell.style.borderBottomRightRadius = (!down && !right) ? RAD+"px" : "0";
      const sh = [];
      if(!up)   sh.push("inset 0 2px 0 rgba(255,255,255,.45)");
      if(!down) sh.push("inset 0 -5px 9px rgba(0,0,0,.22)");
      if(!left) sh.push("inset 2px 0 0 rgba(255,255,255,.15)");
      cell.style.boxShadow = sh.join(",");
      el.appendChild(cell);
    }

    // grip on the cell closest to the shape's centre of mass
    const cr = sumR / b.cells.length, cc = sumC / b.cells.length;
    let bestCell = b.cells[0], bestD = Infinity;
    for(const rc of b.cells){
      const d = (rc[0]-cr)*(rc[0]-cr) + (rc[1]-cc)*(rc[1]-cc);
      if(d < bestD){ bestD = d; bestCell = rc; }
    }
    // tweede kleur als hoekvlak, bom-teller, ijslaag en sleutel
    if(b.colors && b.colors.length > 1){
      for(const cellEl of el.children){
        const half = document.createElement("div");
        half.className = "half2 c-" + b.colors[1];
        cellEl.appendChild(half);
      }
    }
    if(b.bomb || b.frozen || b.key){
      const size = Math.max(13, Math.round(cellSize*0.52));
      const anchor = b.cells[0];
      if(b.key){
        const mark = document.createElement("div");
        mark.className = "keymark";
        mark.textContent = "🔑";
        mark.style.left = (anchor[1]*cellSize) + "px";
        mark.style.top  = (anchor[0]*cellSize) + "px";
        mark.style.width = cellSize + "px";
        mark.style.height = cellSize + "px";
        mark.style.fontSize = Math.round(cellSize*0.5) + "px";
        el.appendChild(mark);
      } else {
        const badge = document.createElement("div");
        badge.className = "badge " + (b.bomb ? "bomb" : "frost");
        badge.style.width = size + "px";
        badge.style.height = size + "px";
        badge.style.fontSize = Math.round(size*0.66) + "px";
        badge.style.left = (anchor[1]*cellSize + (cellSize - size)/2) + "px";
        badge.style.top  = (anchor[0]*cellSize + (cellSize - size)/2) + "px";
        badge.dataset.role = b.bomb ? "bomb" : "frost";
        el.appendChild(badge);
      }
    }
    if(b.frozen){
      const frost = document.createElement("div");
      frost.className = "frost-layer";
      el.appendChild(frost);
    }
    if(b.cells.length === 1) return el;
    const grip = gripFor(b);
    grip.style.left = (bestCell[1]*cellSize) + "px";
    grip.style.top  = (bestCell[0]*cellSize) + "px";
    grip.style.width = cellSize + "px";
    grip.style.height = cellSize + "px";
    el.appendChild(grip);
    return el;
  }

  function placeBlockEl(b){
    b.el.style.left = (b.col * cellSize) + "px";
    b.el.style.top  = (b.row * cellSize) + "px";
  }

  function buildBoard(){
    cellSize = computeCellSize();
    boardEl.style.width  = (COLS*cellSize + 2*FRAME) + "px";
    boardEl.style.height = (ROWS*cellSize + 2*FRAME) + "px";

    cellsLayer.style.left = FRAME + "px";
    cellsLayer.style.top  = FRAME + "px";
    cellsLayer.style.width  = (COLS*cellSize) + "px";
    cellsLayer.style.height = (ROWS*cellSize) + "px";
    cellsLayer.style.gridTemplateColumns = "repeat(" + COLS + ", 1fr)";
    cellsLayer.style.gridTemplateRows = "repeat(" + ROWS + ", 1fr)";
    boardEl.style.setProperty("--cell-gap", Math.max(1, Math.round(cellSize*0.055)) + "px");
    boardEl.style.setProperty("--cell-rad", Math.max(3, Math.round(cellSize*0.17)) + "px");
    boardEl.style.setProperty("--dot", Math.max(3, Math.round(cellSize*0.085)) + "px");
    boardEl.style.setProperty("--reach", Math.max(5, Math.round(cellSize*0.135)) + "px");
    cellsLayer.innerHTML = "";
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const cell = document.createElement("div");
        cell.className = "cell" + (wallSet.has(key(r,c)) ? " wall" : "")
                       + (iceSet.has(key(r,c)) ? " ice" : "");
        cellsLayer.appendChild(cell);
      }
    }

    blocksLayer.style.left = FRAME + "px";
    blocksLayer.style.top  = FRAME + "px";
    blocksLayer.style.width  = (COLS*cellSize) + "px";
    blocksLayer.style.height = (ROWS*cellSize) + "px";

    gatesLayer.innerHTML = "";
    const thin = Math.round(cellSize * 0.30);
    gates.forEach(g => {
      const el = document.createElement("div");
      el.className = "gate c-" + g.color;
      const long = g.span*cellSize - thin;
      const off  = FRAME + g.index*cellSize + thin/2;
      if(g.side === "left" || g.side === "right"){
        el.style.top = off + "px";
        el.style.height = long + "px";
        el.style.width = (FRAME-2) + "px";
        if(g.side === "left"){ el.style.left = "1px";  el.style.borderRadius = "0 8px 8px 0"; }
        else                 { el.style.right = "1px"; el.style.borderRadius = "8px 0 0 8px"; }
      } else {
        el.style.left = off + "px";
        el.style.width = long + "px";
        el.style.height = (FRAME-2) + "px";
        if(g.side === "top"){ el.style.top = "1px";    el.style.borderRadius = "0 0 8px 8px"; }
        else                { el.style.bottom = "1px"; el.style.borderRadius = "8px 8px 0 0"; }
      }
      if(!gateOpen(g)) el.classList.add("shut");
      gatesLayer.appendChild(el);

      if(g.locked || g.keyLocked){
        const badge = document.createElement("div");
        badge.className = "gate-lock";
        const size = Math.max(14, Math.round(cellSize*0.46));
        badge.style.width = size + "px";
        badge.style.height = size + "px";
        badge.style.fontSize = Math.round(size*0.62) + "px";
        const mid = FRAME + g.index*cellSize + (g.span*cellSize)/2;
        if(g.side === "left" || g.side === "right"){
          badge.style.top = (mid - size/2) + "px";
          badge.style[g.side] = "-2px";
        } else {
          badge.style.left = (mid - size/2) + "px";
          badge.style[g.side] = "-2px";
        }
        badge.dataset.gateColor = g.color;
        gatesLayer.appendChild(badge);
      }
    });

    arrowsLayer.style.left = FRAME + "px";
    arrowsLayer.style.top  = FRAME + "px";
    arrowsLayer.style.width  = (COLS*cellSize) + "px";
    arrowsLayer.style.height = (ROWS*cellSize) + "px";
    arrowsLayer.innerHTML = "";
    const GLYPH = {top:"▲", bottom:"▼", left:"◀", right:"▶"};
    arrowMap.forEach((dir, k) => {
      const [r, c] = k.split(",").map(Number);
      const el = document.createElement("div");
      el.className = "arrow-tile";
      el.textContent = GLYPH[dir];
      el.style.left = (c*cellSize) + "px";
      el.style.top  = (r*cellSize) + "px";
      el.style.width = cellSize + "px";
      el.style.height = cellSize + "px";
      el.style.fontSize = Math.round(cellSize*0.42) + "px";
      arrowsLayer.appendChild(el);
    });

    blocksLayer.innerHTML = "";
    blocks.forEach(b => {
      const el = buildBlockEl(b);
      b.el = el;
      placeBlockEl(b);
      if(b.exited){ el.classList.add("exited"); el.style.opacity = "0"; }
      attachDrag(b);
      blocksLayer.appendChild(el);
    });
  }

  /* ---------- dragging ---------- */

  function attachDrag(block){
    block.el.addEventListener("pointerdown", e => onDown(e, block));
    block.el.addEventListener("pointermove", e => onMove(e, block));
    block.el.addEventListener("pointerup",   e => onUp(e, block));
    block.el.addEventListener("pointercancel", e => onUp(e, block));
  }

  function onDown(e, b){
    if(b.exited || winShown || failed || blockFrozen(b)) return;
    e.preventDefault();
    b.drag = {
      x:e.clientX, y:e.clientY,
      row:b.row, col:b.col,
      axis: b.move === "A" ? null : b.move,
      range:null, raw:0
    };
    b.occ = occupancy(b.id);
    if(b.drag.axis) b.drag.range = dragRange(b, b.drag.axis, b.occ);
    b.el.classList.add("dragging");
    try{ b.el.setPointerCapture(e.pointerId); }catch(err){}
  }

  function onMove(e, b){
    if(!b.drag) return;
    const dx = e.clientX - b.drag.x;
    const dy = e.clientY - b.drag.y;
    if(!b.drag.axis){
      if(Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
      b.drag.axis = Math.abs(dx) > Math.abs(dy) ? "H" : "V";
      b.drag.range = dragRange(b, b.drag.axis, b.occ);
    }
    const rg = b.drag.range;
    const lo = rg.exitSide === "neg" ? -rg.exitOffset : -rg.neg;
    const hi = rg.exitSide === "pos" ?  rg.exitOffset :  rg.pos;
    let raw = (b.drag.axis === "H" ? dx : dy) / cellSize;
    raw = Math.max(lo, Math.min(hi, raw));
    b.drag.raw = raw;
    if(b.drag.axis === "H") b.el.style.left = ((b.drag.col + raw) * cellSize) + "px";
    else                    b.el.style.top  = ((b.drag.row + raw) * cellSize) + "px";
  }

  function onUp(e, b){
    if(!b.drag) return;
    const drag = b.drag;
    b.drag = null;
    b.el.classList.remove("dragging");
    if(!drag.axis || !drag.range){ placeBlockEl(b); return; }

    const rg = drag.range, raw = drag.raw;
    let offset = null, leaving = false;
    const exitInfo = exitGateFor(b, b.row, b.col, b.occ);

    if(rg.exitSide === "pos" && raw > rg.pos + 0.5){ offset = rg.exitOffset; leaving = true; }
    else if(rg.exitSide === "neg" && raw < -rg.neg - 0.5){ offset = -rg.exitOffset; leaving = true; }
    else offset = Math.max(-rg.neg, Math.min(rg.pos, Math.round(raw)));

    if(offset === 0 && !leaving){ placeBlockEl(b); return; }

    // waar het blok belandt: ijs kan het verder meenemen
    let landR = drag.row, landC = drag.col, skid = null;
    let dr = drag.axis === "V" ? Math.sign(offset) : 0;
    let dc = drag.axis === "H" ? Math.sign(offset) : 0;
    if(!leaving){
      if(drag.axis === "H") landC = drag.col + offset;
      else                  landR = drag.row + offset;
      const rest = iceSlide(b, landR, landC, dr, dc, b.occ);
      if(rest.exit){
        // doorglijden tot buiten het bord
        leaving = true;
        const info = exitGateFor(b, rest.r, rest.c, b.occ);
        const steps = info ? info.steps : Math.max(ROWS, COLS);
        skid = {r: rest.r + dr*steps, c: rest.c + dc*steps};
      } else if(rest.r !== landR || rest.c !== landC){
        skid = rest;
      }
    } else {
      // het blok schuift het bord uit, dus de eindstand ligt buiten het bord
      landR = drag.row; landC = drag.col;
    }

    pushHistory();
    startClock();
    if(skid){
      b.row = skid.r; b.col = skid.c;
    } else if(leaving){
      if(drag.axis === "H") b.col = drag.col + offset;
      else                  b.row = drag.row + offset;
    } else {
      b.row = landR; b.col = landC;
    }

    moveCount++;
    movesCountEl.textContent = moveCount;
    undoBtn.disabled = false;

    requestAnimationFrame(() => {
      if(skid){
        // eerst tot waar de speler sleepte, dan zichtbaar doorglijden
        b.el.style.left = (landC * cellSize) + "px";
        b.el.style.top  = (landR * cellSize) + "px";
        const dist = Math.abs(skid.r - landR) + Math.abs(skid.c - landC);
        setTimeout(() => {
          b.el.style.transitionTimingFunction = "cubic-bezier(.15,.7,.4,1)";
          b.el.style.transitionDuration = Math.min(0.62, 0.13 + dist*0.075) + "s";
          placeBlockEl(b);
          setTimeout(() => {
            b.el.style.transitionTimingFunction = "";
            b.el.style.transitionDuration = "";
          }, 700);
        }, 90);
      } else {
        placeBlockEl(b);
      }
      if(leaving){
        b.exited = true;
        if(b.colors && b.colors.length > 1 && b.bonusColor && exitInfo &&
           exitInfo.gate.color !== b.bonusColor) bonusKept = false;
        b.el.classList.add("exited");
        onBoardChanged();
        setTimeout(() => { b.el.style.opacity = "0"; }, 200);
      } else {
        refreshBadges();
      }
    });

    checkBombs();
    if(leaving) setTimeout(checkWin, 380);
  }

  /* ---------- klok en bommen ---------- */

  function fmtTime(sec){
    sec = Math.max(0, Math.ceil(sec));
    return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");
  }

  function startClock(){
    if(clockStarted || failed) return;
    if(!timeLimit && !blocks.some(b => b.bomb && b.bomb.type === "seconds")) return;
    clockStarted = Date.now();
    clockId = setInterval(tickClock, 200);
    tickClock();
  }

  function stopClock(){
    if(clockId){ clearInterval(clockId); clockId = null; }
  }

  function tickClock(){
    if(winShown || failed) return;
    const elapsed = (Date.now() - clockStarted)/1000;
    if(timeLimit){
      const left = timeLimit - elapsed;
      timeLeftEl.textContent = fmtTime(left);
      if(left <= 0){ loseLevel("tijd"); return; }
    }
    checkBombs();
    refreshBadges();
  }

  function checkBombs(){
    if(winShown || failed) return;
    for(const b of blocks){
      if(!b.bomb || b.exited) continue;
      if(bombLeft(b) <= 0){ loseLevel("bom", b); return; }
    }
  }

  function refreshBadges(){
    for(const b of blocks){
      if(!b.el) continue;
      const badge = b.el.querySelector(".badge");
      if(badge){
        if(badge.dataset.role === "bomb"){
          const left = Math.max(0, bombLeft(b));
          badge.textContent = left;
          b.el.classList.toggle("armed", !b.exited && left <= 3);
        } else {
          const left = Math.max(0, b.frozen.thawAfter - exitedTotal());
          badge.textContent = left;
        }
      }
      const frozenNow = blockFrozen(b);
      b.el.classList.toggle("frozen", frozenNow);
      const frost = b.el.querySelector(".frost-layer");
      if(frost) frost.style.display = frozenNow ? "" : "none";
      const fb = b.el.querySelector(".badge.frost");
      if(fb) fb.style.display = frozenNow ? "" : "none";
    }
    // poorten die opengaan
    const lockEls = gatesLayer.querySelectorAll(".gate-lock");
    gates.forEach((g, i) => {
      const el = gatesLayer.children[i];
      if(el && el.classList.contains("gate")) el.classList.toggle("shut", !gateOpen(g));
    });
    lockEls.forEach(el => {
      const g = gates.find(x => x.color === el.dataset.gateColor);
      if(!g) return;
      if(gateOpen(g)){ el.style.display = "none"; return; }
      el.style.display = "";
      el.textContent = g.keyLocked ? "🔒" : Math.max(0, g.locked.openAfter - exitedTotal());
    });
  }

  function onBoardChanged(){
    updateLeftCount();
    refreshBadges();
  }

  function loseLevel(reason, block){
    if(failed || winShown) return;
    failed = true;
    stopClock();
    if(reason === "tijd"){
      failEmoji.textContent = "⏰";
      failTitle.textContent = "Tijd voorbij";
      failSub.textContent = "Dit level heeft een klok van " + fmtTime(timeLimit) + ".";
    } else {
      failEmoji.textContent = "💥";
      failTitle.textContent = "Boem!";
      failSub.textContent = "Het " + (block ? colorName(block.color) : "") +
        " bomblok moest eerder naar zijn poort.";
      if(block && block.el) block.el.classList.remove("armed");
    }
    failModal.classList.add("show");
  }

  function colorName(c){
    return ({red:"rode",orange:"oranje",yellow:"gele",green:"groene",teal:"turkooize",
             blue:"blauwe",purple:"paarse",pink:"roze",stone:"grijze"})[c] || c;
  }

  function starsFor(idx, moves){
    const lvl = LEVELS[idx];
    const margin = lvl.starMargin === undefined ? 0.25 : lvl.starMargin;
    if(moves <= lvl.par) return 3;
    if(moves <= Math.ceil(lvl.par * (1 + margin))) return 2;
    return 1;
  }

  /* ---------- history ---------- */

  function pushHistory(){
    history.push({
      moves: moveCount,
      state: blocks.map(b => ({row:b.row, col:b.col, exited:b.exited}))
    });
    if(history.length > 200) history.shift();
  }

  function undo(){
    const snap = history.pop();
    if(!snap) return;
    moveCount = snap.moves;
    movesCountEl.textContent = moveCount;
    blocks.forEach((b, i) => {
      const s = snap.state[i];
      b.row = s.row; b.col = s.col;
      const wasOut = b.exited;
      b.exited = s.exited;
      if(wasOut && !b.exited){
        b.el.classList.remove("exited");
        b.el.style.opacity = "1";
      }
      placeBlockEl(b);
    });
    onBoardChanged();
    undoBtn.disabled = history.length === 0;
  }

  /* ---------- win ---------- */

  function updateLeftCount(){
    let left = 0;
    for(const b of blocks) if(gateOf(b.color) && !b.exited) left++;
    leftCountEl.textContent = left;
  }

  function checkWin(){
    if(winShown || failed) return;
    if(!blocks.every(b => !gatesOf(b).length || b.exited)) return;
    winShown = true;
    stopClock();
    const par = LEVELS[currentLevel].par;
    const prevBest = progress.best[currentLevel];
    const stars = starsFor(currentLevel, moveCount);
    markSolved(currentLevel, moveCount, stars);
    const extra = (prevBest !== undefined && moveCount < prevBest) ? " Nieuw record!" : "";
    [...winStars.children].forEach((el, i) => el.classList.toggle("on", i < stars));
    if(stars === 3){
      winEmoji.textContent = "🏅";
      winTitle.textContent = "Meesterlijk!";
      winSub.textContent = "In " + moveCount + " zetten — het doel was " + par + "." + extra;
    } else {
      winEmoji.textContent = "🎉";
      winTitle.textContent = "Level gehaald!";
      winSub.textContent = "Opgelost in " + moveCount + " zetten. Drie sterren vanaf " + par + "." + extra;
    }
    const hasTwoColor = blocks.some(b => b.colors && b.colors.length > 1);
    winBonus.hidden = !(hasTwoColor && bonusKept);
    winModal.classList.add("show");
    launchConfetti();
  }

  function launchConfetti(){
    const colors = ["#F94144","#F3722C","#F9C74F","#43AA8B","#22B8CF","#277DA1","#9D4EDD","#F72585"];
    const card = winModal.querySelector(".win-card");
    for(let i=0;i<26;i++){
      const p = document.createElement("div");
      p.className = "confetti";
      p.style.left = (Math.random()*100) + "%";
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.4 + Math.random()*1.1) + "s";
      p.style.animationDelay = (Math.random()*0.3) + "s";
      card.appendChild(p);
      setTimeout(() => p.remove(), 3000);
    }
  }

  /* ---------- levels ---------- */

  function loadLevel(idx){
    currentLevel = idx;
    winShown = false;
    failed = false;
    bonusKept = true;
    moveCount = 0;
    history = [];
    undoBtn.disabled = true;
    movesCountEl.textContent = "0";
    winModal.classList.remove("show");
    failModal.classList.remove("show");
    stopClock();
    clockStarted = 0;

    const lvl = LEVELS[idx];
    ROWS = lvl.rows; COLS = lvl.cols;
    wallSet = new Set(lvl.walls.map(w => key(w[0], w[1])));
    iceSet = new Set((lvl.ice || []).map(t => key(t[0], t[1])));
    arrowMap = new Map((lvl.arrows || []).map(a => [key(a[0], a[1]), a[2]]));
    blocks = lvl.blocks.map(b => ({
      id:b.id, color:b.color, move:b.move,
      colors:b.colors || null, bonusColor:b.bonusColor || null,
      bomb:b.bomb || null, frozen:b.frozen || null, key:!!b.key,
      cells:b.cells, row:b.row, col:b.col, exited:false
    }));
    gates = lvl.gates.map(g => Object.assign({}, g));
    timeLimit = lvl.timeLimit || null;
    timerPill.hidden = !timeLimit;
    if(timeLimit) timeLeftEl.textContent = fmtTime(timeLimit);

    lvlNumEl.textContent = (idx+1);
    lvlNameEl.textContent = lvl.name;
    const best = progress.best[idx];
    lvlMetaEl.textContent = "doel: " + lvl.par + " zetten" + (best !== undefined ? " · jouw best: " + best : "");
    hintEl.textContent = lvl.hint || "";

    buildBoard();
    onBoardChanged();
    renderLevelTiles();
  }

  function markSolved(idx, moves, stars){
    if(!progress.solved.includes(idx)) progress.solved.push(idx);
    if(!progress.stars) progress.stars = {};
    if(progress.stars[idx] === undefined || stars > progress.stars[idx]) progress.stars[idx] = stars;
    if(progress.best[idx] === undefined || moves < progress.best[idx]) progress.best[idx] = moves;
    saveProgress();
    const best = progress.best[idx];
    lvlMetaEl.textContent = "doel: " + LEVELS[idx].par + " zetten · jouw best: " + best;
    renderLevelTiles();
  }

  function renderLevelTiles(){
    levelsEl.innerHTML = "";
    LEVELS.forEach((lvl, i) => {
      const solved = progress.solved.includes(i);
      const best = progress.best[i];
      const perfect = solved && best <= lvl.par;
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "lvl-tile" + (i === currentLevel ? " active" : "")
                     + (solved ? " solved" : "") + (perfect ? " perfect" : "");
      tile.title = lvl.name + " — doel: " + lvl.par + " zetten";
      tile.setAttribute("aria-label", "Level " + (i+1) + ": " + lvl.name);
      const n = document.createElement("div");
      n.className = "n";
      n.textContent = (i+1);
      const p = document.createElement("div");
      p.className = "p";
      p.textContent = solved ? best + "/" + lvl.par : lvl.par + " zet";
      tile.appendChild(n); tile.appendChild(p);
      if(solved){
        const st = document.createElement("div");
        st.className = "st";
        const got = (progress.stars && progress.stars[i]) || (perfect ? 3 : 1);
        st.textContent = "★".repeat(got) + "☆".repeat(3 - got);
        tile.appendChild(st);
      }
      tile.addEventListener("click", () => loadLevel(i));
      levelsEl.appendChild(tile);
    });
    progressEl.textContent = progress.solved.length + "/" + LEVELS.length + " gehaald";
  }

  /* ---------- storage ---------- */

  async function loadProgress(){
    try{
      if(window.storage){
        const res = await window.storage.get("kleurjam-progress", false);
        if(res && res.value){
          const parsed = JSON.parse(res.value);
          if(parsed && Array.isArray(parsed.solved)) progress = parsed;
        }
      }
    }catch(err){ /* nog niets opgeslagen */ }
  }

  async function saveProgress(){
    try{
      if(window.storage) await window.storage.set("kleurjam-progress", JSON.stringify(progress), false);
    }catch(err){ /* best effort */ }
  }

  /* ---------- wiring ---------- */

  document.getElementById("restart-btn").addEventListener("click", () => loadLevel(currentLevel));
  document.getElementById("retry-btn").addEventListener("click", () => loadLevel(currentLevel));
  document.getElementById("undo-btn").addEventListener("click", undo);
  document.getElementById("replay-btn").addEventListener("click", () => loadLevel(currentLevel));
  document.getElementById("next-level-btn").addEventListener("click", () => {
    loadLevel(Math.min(currentLevel + 1, LEVELS.length - 1));
  });
  document.addEventListener("keydown", e => {
    if((e.key === "z" || e.key === "Z") && !winShown && !failed) undo();
    if(e.key === "r" || e.key === "R") loadLevel(currentLevel);
  });

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildBoard, 120);
  });

  (async function init(){
    await loadProgress();
    loadLevel(0);
  })();
})();
</script>
</body>
</html>
