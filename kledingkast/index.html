<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kledingkast">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17161a" media="(prefers-color-scheme: dark)">
<meta name="description" content="Je eigen digitale kledingkast: kledingstukken toevoegen en outfits samenstellen.">
<title>Mijn Kledingkast</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="app">
  <header id="topbar" class="topbar"></header>
  <main id="view" class="view"></main>
  <nav id="tabbar" class="tabbar"></nav>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- Verborgen bestandskiezers: hergebruikt door alle schermen -->
<input type="file" id="filePhoto" accept="image/*" multiple hidden>
<input type="file" id="fileBulk" accept="image/*" multiple hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
